name: Build & Push Image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (default: git sha)'
        required: false

# Images go to Quay with its own credentials; the job only reads the repo.
permissions:
  contents: read

env:
  REGISTRY: quay.io
  IMAGE_NAME: amobrem/openshiftpulse

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install & Build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Set image tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          elif [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          else
            tag="sha-${GITHUB_SHA::8}"
          fi
          if [[ ! "$tag" =~ ^[A-Za-z0-9._-]{1,128}$ ]]; then
            echo "::error::invalid image tag (allowed: A-Z a-z 0-9 . _ -, 1-128 chars)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # The image the Helm install/upgrade/rollback/uninstall/preview Jobs run
      # (helmInstall.ts). Built and checked before the registry login, so a
      # failed check publishes nothing at all. Pushed at the end of the job.
      - name: Build helm runner
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.helm-runner
          load: true
          push: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-helm-runner:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-helm-runner:latest
          platforms: linux/amd64

      # Each command must exist and work: the preview Job pipes `helm template`
      # through awk and sha256sum. (`command -v a b c` succeeds if any one is
      # found, so each is checked on its own.)
      - name: Smoke-test helm runner
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-helm-runner:${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/sh "$IMAGE" -c '
            set -eu
            for c in helm awk sha256sum; do command -v "$c" >/dev/null || { echo "missing $c" >&2; exit 1; }; done
            printf "a b\n" | awk "{print \$2}" | grep -qx b
            printf x | sha256sum | grep -q "^2d711642"
            helm version
          '

      - name: Log in to Quay.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          platforms: linux/amd64

      # The render service the agent uses to see a draft dashboard before saving it.
      # Deployed by pulse-operator only when spec.render.enabled is set.
      - name: Build and push render service
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.render
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-render:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-render:latest
          platforms: linux/amd64

      # Built and smoke-tested above, before the login.
      - name: Push helm runner
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-helm-runner
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$TAG")"
          echo "Helm runner: $digest"
          {
            echo "### Helm runner image"
            echo ""
            echo "\`$IMAGE:$TAG\` = \`$digest\`"
            echo ""
            echo "Pin this digest in pulse-operator (RELATED_IMAGE_HELM_RUNNER, or spec.ui.helmRunnerImage on the OpenShiftPulse CR) to enable Helm actions."
          } >> "$GITHUB_STEP_SUMMARY"
