name: Build & Push Image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (default: git sha)'
        required: false

env:
  REGISTRY: quay.io
  IMAGE_NAME: amobrem/openshiftpulse

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install & Build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Set image tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [[ -n "${{ inputs.tag }}" ]]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=sha-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Quay.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          platforms: linux/amd64

      # The render service the agent uses to see a draft dashboard before saving it.
      # Deployed by pulse-operator only when spec.render.enabled is set.
      - name: Build and push render service
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.render
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-render:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-render:latest
          platforms: linux/amd64

      # The image the Helm install/upgrade/rollback/uninstall Jobs run (helmInstall.ts).
      # The UI only accepts it digest-pinned, so pulse-operator must pin the
      # digest this step prints before a cluster can use a new build.
      # Built and loaded locally first, checked, and only then pushed, so a
      # broken image never reaches the registry.
      - name: Build helm runner
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.helm-runner
          load: true
          push: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-helm-runner:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-helm-runner:latest
          platforms: linux/amd64

      # The preview Job pipes `helm template` through awk and sha256sum.
      - name: Smoke-test helm runner
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-helm-runner:${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/sh "$IMAGE" -c 'set -e; command -v helm awk sha256sum; helm version'

      - name: Push helm runner
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-helm-runner
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$TAG")"
          echo "Helm runner: $digest"
          {
            echo "### Helm runner image"
            echo ""
            echo "\`$IMAGE:$TAG\` = \`$digest\`"
            echo ""
            echo "Pin this digest in pulse-operator for clusters to run it."
          } >> "$GITHUB_STEP_SUMMARY"
