name: E2E Tests (Scheduled)

on:
  schedule:
    - cron: '0 0 * * 0'
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout agent repo
        uses: actions/checkout@v4
        with:
          repository: PulseSRE/pulse-agent
          path: pulse-agent

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Start mock agent stack
        run: docker compose -f e2e/docker-compose.agent.yml up -d --build --wait
        timeout-minutes: 5
        env:
          AGENT_REPO_PATH: ${{ github.workspace }}/pulse-agent

      - name: Run E2E tests
        env:
          PULSE_AGENT_WS_TOKEN: e2e-test-token
        run: pnpm exec playwright test --config e2e/playwright.config.ts

      - name: Stop mock agent stack
        if: always()
        run: docker compose -f e2e/docker-compose.agent.yml down

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Post summary
        if: always()
        run: |
          echo "## E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "All E2E tests passed." >> $GITHUB_STEP_SUMMARY
          else
            echo "Some E2E tests failed. See the Playwright report artifact for details." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY

  # ── Scheduled-failure notifier ──────────────────────────────────────────
  #
  # This weekly run went red on 2026-08-09 and stayed red — the Playwright
  # config had stopped loading entirely, so the whole E2E suite was dead for
  # eleven days and the only trace was a red dot nobody was looking at.
  #
  # The "Post summary" step above writes to the job summary, which is only
  # visible to someone who already opened the run. That is the gap this closes.
  #
  # Deliberately limited to `schedule`. Tag-triggered runs have a human
  # watching a release; the unattended weekly run does not.
  notify-on-scheduled-failure:
    needs: [e2e]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Weekly E2E run is failing"

          # One issue per outage, not one per week.
          EXISTING=$(gh issue list --repo "$REPO" --state open \
            --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')

          BODY=$(printf '%s\n' \
            "The scheduled \`E2E Tests\` run failed." \
            "" \
            "Run: $RUN_URL" \
            "Commit: \`${GITHUB_SHA:0:7}\`" \
            "" \
            "This runs weekly and unattended, so nothing else will surface it." \
            "The Playwright report is attached to the run as an artifact." \
            "" \
            "Close this once the run is green again — a new issue opens if it breaks later.")

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY"
            echo "Commented on existing issue #$EXISTING"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY"
            echo "Opened a new failure issue"
          fi
