apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openshiftpulse-reader
  labels:
    {{- include "openshiftpulse.labels" . | nindent 4 }}
rules:
# The service account is pod identity only — it never calls the Kubernetes
# API to read or write resources. All data-plane traffic (list/watch/get,
# create/update/delete) is proxied by nginx using the user's own OAuth
# token (X-Forwarded-Access-Token), which fails closed if absent. The only
# calls this SA itself makes are the two below, used by the OAuth proxy
# sidecar to validate the bearer token and authorize access to the UI.
- nonResourceURLs: ["/api", "/api/*", "/apis", "/apis/*", "/version"]
  verbs: [get]
- apiGroups: [authentication.k8s.io]
  resources: [tokenreviews]
  verbs: [create]
- apiGroups: [authorization.k8s.io]
  resources: [subjectaccessreviews]
  verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openshiftpulse-reader
  labels:
    {{- include "openshiftpulse.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openshiftpulse-reader
subjects:
- kind: ServiceAccount
  name: openshiftpulse
  namespace: {{ include "openshiftpulse.namespace" . }}
---
# Grant access to Prometheus/Thanos metrics for dashboard charts
{{- if .Values.monitoring.prometheus.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openshiftpulse-monitoring-view
  labels:
    {{- include "openshiftpulse.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
subjects:
- kind: ServiceAccount
  name: openshiftpulse
  namespace: {{ include "openshiftpulse.namespace" . }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openshiftpulse-ns
  namespace: {{ include "openshiftpulse.namespace" . }}
rules:
- apiGroups: [""]
  resources: [configmaps, secrets]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openshiftpulse-ns
  namespace: {{ include "openshiftpulse.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openshiftpulse-ns
subjects:
- kind: ServiceAccount
  name: openshiftpulse
  namespace: {{ include "openshiftpulse.namespace" . }}
