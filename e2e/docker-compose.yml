# Integration test stack: UI + Agent + PostgreSQL + Mock K8s API
# Usage: docker compose -f e2e/docker-compose.yml up --build   (or: pnpm run e2e:stack)
#        PULSE_URL=http://localhost:9000 pnpm run e2e:integration
#
# The agent and PostgreSQL come from docker-compose.agent.yml, the stack
# e2e/start-agent.sh already runs, so there is one definition of how the agent
# starts. This file used to define its own: it built a Dockerfile.full that
# pulse-agent does not have, set WS_AUTH_TOKEN (the agent reads
# PULSE_AGENT_WS_TOKEN), had no database, and health-checked /health, which
# needs a token — so it could not start.
#
# The agent here has no kubeconfig (KUBECONFIG=/dev/null): it serves the UI's
# agent API and view CRUD, not cluster reads. Cluster data in the UI comes from
# mock-k8s through the dev server's proxy.

include:
  - docker-compose.agent.yml

services:
  mock-k8s:
    build:
      context: .
      dockerfile: mock-k8s.Dockerfile
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8001/api/v1/nodes"]
      interval: 5s
      timeout: 3s
      retries: 3

  ui:
    build:
      context: ../
      dockerfile: e2e/ui.Dockerfile
    environment:
      K8S_API_URL: "http://mock-k8s:8001"
      PULSE_AGENT_URL: "http://agent:8080"
      # Must match PULSE_AGENT_WS_TOKEN in docker-compose.agent.yml; the dev
      # server injects it into proxied agent requests, the browser never sees it.
      PULSE_AGENT_WS_TOKEN: "e2e-test-token"
    ports:
      - "9000:9000"
    depends_on:
      mock-k8s:
        condition: service_healthy
      agent:
        condition: service_healthy
